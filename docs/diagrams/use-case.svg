  <g transform="translate(100, 200)">
    <circle cx="20" cy="20" r="16" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
    <line x1="20" y1="36" x2="20" y2="70" stroke="#0f172a" stroke-width="2"/>
    <line x1="-5" y1="50" x2="45" y2="50" stroke="#0f172a" stroke-width="2"/>
    <line x1="20" y1="70" x2="0" y2="105" stroke="#0f172a" stroke-width="2"/>
    <line x1="20" y1="70" x2="40" y2="105" stroke="#0f172a" stroke-width="2"/>
    <text x="20" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Pelanggan</text>
    <text x="20" y="142" text-anchor="middle" font-size="11" fill="#64748b">(Customer)</text>
  </g>

  <!-- Actor: CS -->
  <g transform="translate(100, 520)">
    <circle cx="20" cy="20" r="16" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
    <line x1="20" y1="36" x2="20" y2="70" stroke="#0f172a" stroke-width="2"/>
    <line x1="-5" y1="50" x2="45" y2="50" stroke="#0f172a" stroke-width="2"/>
    <line x1="20" y1="70" x2="0" y2="105" stroke="#0f172a" stroke-width="2"/>
    <line x1="20" y1="70" x2="40" y2="105" stroke="#0f172a" stroke-width="2"/>
    <text x="20" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Customer Service</text>
