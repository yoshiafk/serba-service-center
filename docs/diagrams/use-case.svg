  <rect x="240" y="60" width="720" height="38" rx="12" fill="#2563eb" />
  <rect x="240" y="86" width="720" height="12" fill="#2563eb" />
  <text x="600" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Sistem Informasi Serba Service Center (Boundary)</text>

  <!-- Left Actors -->
