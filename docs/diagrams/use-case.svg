  <path d="M 820 385 L 820 475" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="855" y="430" text-anchor="middle" font-size="9" fill="#475569">&lt;&lt;include&gt;&gt;</text>

  <path d="M 720 500 L 700 520" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="725" y="525" text-anchor="middle" font-size="9" fill="#475569">&lt;&lt;include&gt;&gt;</text>

  <path d="M 480 575 L 540 640" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
